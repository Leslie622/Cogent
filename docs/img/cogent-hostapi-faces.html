<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cogent 能力全景 · 四扇门与唯一汇合点</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Microsoft YaHei', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">能力全景 · 四扇门 · 全部汇入同一注册表 · 2026-11-14</p>
    <h1>Cogent 本地 Agent 能开几扇门</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hostapi-faces-title hostapi-faces-desc">
        <title id="hostapi-faces-title">Cogent 能力全景：四扇门与唯一汇合点</title>
        <desc id="hostapi-faces-desc">Cogent 本地 Agent 的四扇调用门：stdio JSON-RPC 供 Electron main 专用；HTTP/WS 通道持 scoped token 服务任意浏览器页与脚本，默认只听本机、远程模式放开监听，另有拨出中继变体穿 NAT；HTTP chat API 以 HTTP 加 SSE 提供 chat 形状接口，审批经事件推送与 POST 回答往返；对外 MCP Server 走标准协议。四门全部汇入同一 HostApi 方法注册表后分发进服务层与 pi 内核。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ARROWS (before nodes) ============ -->

        <!-- 门 1：stdio → 注册表（主干，accent） -->
        <path d="M 325,320 V 346" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- 门 2：HTTP/WS 通道 → 注册表 -->
        <path d="M 630,320 V 346" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 门 3：HTTP chat API → 注册表（未立项虚线） -->
        <path d="M 915,320 V 346" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- 门 4：MCP Server → 注册表（阶段 5 虚线） -->
        <path d="M 1140,320 V 346" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 注册表 → 服务层 -->
        <path d="M 720,410 V 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============ NODES ============ -->

        <!-- 门 1：stdio JSON-RPC（coral 焦点 2：主干，现状） -->
        <rect x="200" y="110" width="250" height="210" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
        <text x="325" y="138" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">stdio JSON-RPC</text>
        <text x="325" y="160" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">Electron main 专用</text>
        <text x="325" y="180" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">父子管道 · 一行一帧</text>
        <text x="325" y="200" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">血缘信任 · 免鉴权</text>
        <text x="325" y="220" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">唯一不走网络的门</text>
        <text x="325" y="244" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">现状 · protocol v1 已在跑</text>

        <!-- 门 2：HTTP/WS 通道（阶段 2） -->
        <rect x="470" y="110" width="320" height="210" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="630" y="138" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">HTTP/WS 通道</text>
        <text x="630" y="160" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">scoped token 鉴权 · 阶段 2</text>
        <text x="630" y="180" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">默认只听 127.0.0.1</text>
        <text x="630" y="200" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">远程模式 = 放开监听（同一扇门）</text>
        <text x="630" y="220" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">谁连都行：webview 页 / 远程浏览器 / 脚本</text>
        <text x="630" y="244" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">形态：WS 为主 · HTTP POST 供 curl / 脚本（D2）</text>
        <text x="630" y="264" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">变体：拨出中继穿 NAT（数据经云 · 未立项）</text>

        <!-- 门 3：HTTP chat API（未立项） -->
        <rect x="810" y="110" width="210" height="210" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="915" y="138" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">HTTP chat API</text>
        <text x="915" y="160" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">chat 形状 · HTTP + SSE</text>
        <text x="915" y="180" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">调用方改 baseURL 即切换</text>
        <text x="915" y="204" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">审批：SSE 推请求</text>
        <text x="915" y="224" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">+ POST 回答（可人机协同）</text>
        <text x="915" y="248" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">无人值守：auto / plan 模式</text>
        <text x="915" y="268" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">可加 · 未立项</text>

        <!-- 门 4：对外 MCP Server（阶段 5） -->
        <rect x="1040" y="110" width="200" height="210" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="1140" y="138" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">对外 MCP Server</text>
        <text x="1140" y="160" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">标准协议 · 即插即用</text>
        <text x="1140" y="180" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">HostApi 方法 1:1 映射</text>
        <text x="1140" y="204" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">Bearer 鉴权</text>
        <text x="1140" y="224" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">写操作默认关</text>
        <text x="1140" y="248" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">阶段 5 · D9</text>

        <!-- 汇合点：HostApi 方法注册表（coral 焦点 1） -->
        <rect x="200" y="350" width="1040" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="720" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">HostApi 方法注册表 · 27 方法 + 12 事件 · 所有门的唯一汇合点</text>
        <text x="720" y="394" fill="#5a6580" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">三种帧：请求 / 响应 / 事件（JSON-RPC，与传输无关 —— 同一套帧跑在任何门上）</text>

        <!-- Host 服务层 -->
        <rect x="344" y="444" width="752" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="720" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">Host 服务层 · 会话 / 项目 / 设置 / 凭据 / 审批 / 观测</text>
        <text x="720" y="486" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">KernelRunner（南缝）→ pi AgentSession：循环 / 工具 / 会话树 / 压缩 / 供应商</text>

        <!-- 边界底注 -->
        <text x="720" y="536" fill="#5a6580" font-size="11" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">边界：新增门 = 新增翻译层（引擎与注册表零改动）· 信任根一律本机 · 对外写默认关</text>

        <!-- ============ LEGEND (bottom strip) ============ -->
        <line x1="200" y1="580" x2="1240" y2="580" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="200" y="604" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">图例</text>
        <rect x="252" y="594" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="276" y="604" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">接口约定</text>
        <line x1="360" y1="599" x2="400" y2="599" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="412" y="604" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">计划内</text>
        <line x1="480" y1="599" x2="520" y2="599" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="532" y="604" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">未立项 / 预留</text>
      </svg>
    </div>
  </div>
</body>
</html>
