<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cogent · 文件状态贴纸</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font-family:var(--font-sans,system-ui),"Microsoft YaHei",sans-serif;background:var(--background,#fff);color:var(--foreground,#202024)}button{font:inherit}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:var(--muted-foreground,#777);margin-bottom:7px}h1{font-size:19px;line-height:1.3;letter-spacing:-.4px;margin:0;font-weight:650}.intro{font-size:12px;color:var(--muted-foreground,#777);line-height:1.7;margin:7px 0 0}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}.segmented{display:flex;background:var(--muted,#f3f3f5);border-radius:8px;padding:3px;gap:2px}.segment,.theme{font-size:12px;border:0;background:transparent;color:var(--muted-foreground,#777);padding:7px 11px;border-radius:6px;cursor:pointer}.segment:hover,.theme:hover{background:var(--accent,#e9e9ec);color:var(--accent-foreground,#222)}.segment[aria-pressed="true"]{background:var(--card,#fff);color:var(--card-foreground,#222);box-shadow:0 1px 3px #0000000c}.theme{border:1px solid var(--border,#e5e5e8);margin-left:auto;color:var(--foreground,#222)}.section-title{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;font-weight:600;gap:12px;margin:0 0 11px}.section-title span{font-size:11px;font-weight:400;color:var(--muted-foreground,#777)}
.mockup{--m-bg:#fff;--m-card:#fff;--m-fg:#25252b;--m-muted:#8b8b95;--m-edge:#e7e7ec;--m-hover:#f7f7fa;--m-plus:#009873;--m-minus:#d35e61;--m-surface:#fafafd;--m-focus:#746a93;background:var(--m-bg);color:var(--m-fg)}.mockup[data-palette="dark"]{--m-bg:#1d1d23;--m-card:#222229;--m-fg:#e9e8ee;--m-muted:#91909d;--m-edge:#36353f;--m-hover:#2c2b35;--m-plus:#51c9a1;--m-minus:#ef9395;--m-surface:#27262f;--m-focus:#bea3ef}.catalog{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--m-edge);border-radius:11px;margin-bottom:24px;overflow:hidden}.catalog-item{display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:96px;gap:9px;cursor:pointer;background:var(--m-card);border:0;color:var(--m-muted);padding:12px 4px;position:relative;outline-offset:-3px}.catalog-item:not(:last-child){border-right:1px solid var(--m-edge)}.catalog-item:hover{background:var(--m-hover)}.catalog-item[aria-pressed="true"]:after{position:absolute;content:"";height:2px;left:22%;right:22%;bottom:0;background:var(--m-focus);border-radius:2px}.catalog-item small{font-size:11px;white-space:nowrap}.badge{display:block;flex:none}.badge-label{width:48px;height:28px}.badge-icon{width:28px;height:28px}.file-card{border:1px solid var(--m-edge);border-radius:11px;overflow:hidden;background:var(--m-card)}.summary{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--m-edge);font-size:12px}.summary .summary-icon{color:var(--m-muted)}.summary strong{font-weight:600}.stats{display:inline-flex;align-items:center;justify-content:flex-end;gap:7px;min-width:68px;flex:none;font-size:11px;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}.summary .stats{margin-left:auto}.plus{color:var(--m-plus)}.minus{color:var(--m-minus)}.rows{padding:5px 7px}.file-row{display:flex;align-items:center;gap:10px;padding:6px 7px;min-height:42px;border-radius:6px}.file-row:hover,.file-row.is-active{background:var(--m-hover)}.file-icon{flex:none;width:17px;height:18px}.file-name{font-size:13px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.6}.path-prefix{color:var(--m-muted)}.badge-slot{flex:none;display:flex;align-items:center;justify-content:center;width:48px}.external{display:flex;align-items:center;justify-content:center;color:var(--m-muted);width:21px;flex:none}.muted-stat{color:var(--m-muted)}.footnote{display:flex;gap:10px;align-items:start;font-size:11px;line-height:1.7;color:var(--muted-foreground,#777);margin-top:15px}.footnote strong{color:var(--foreground,#25252b);font-weight:600;white-space:nowrap}.secondary{margin-top:24px}.pair-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.pair{display:flex;align-items:center;justify-content:center;gap:2px;min-height:44px;background:var(--m-card);border:1px solid var(--m-edge);border-radius:8px}.bottom{border-top:1px solid var(--border,#e5e5e8);padding-top:13px;margin-top:22px;font-size:11px;line-height:1.7;color:var(--muted-foreground,#777)}.bottom b{color:var(--foreground,#25252b);font-weight:500}.footer-note{display:flex;justify-content:space-between;gap:12px}.note{font-size:11px;color:var(--muted-foreground,#777);margin:8px 0 0;line-height:1.7}@media(max-width:600px){body{padding:16px}.catalog{grid-template-columns:repeat(4,minmax(0,1fr))}.catalog-item{min-height:88px}.catalog-item:nth-child(4){border-right:0}.catalog-item:nth-child(n+5){border-top:1px solid var(--m-edge)}.pair-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.file-row{gap:7px;padding:6px 4px}.file-name{font-size:12px}.stats{min-width:57px;font-size:10px;gap:4px}.external{display:none}.path-prefix{display:none}.section-title span{font-size:10px}header{margin-bottom:18px}.theme{padding:7px 9px}.segment{padding:7px 10px}}@media(prefers-reduced-motion:no-preference){.catalog-item,.segment,.file-row{transition:background .12s}}
</style></head>
<body><header><div><div class="eyebrow">COGENT / FILE STATUS</div><h1>一套轻巧的文件状态贴纸</h1><p class="intro">水平排列与浅底色，七种状态，两种形态。</p></div></header>
<div class="controls"><div class="segmented" role="group" aria-label="徽章形态"><button class="segment" data-variant="label" aria-pressed="true">文字贴纸</button><button class="segment" data-variant="icon" aria-pressed="false">图形贴纸</button></div><button class="theme" id="palette-button">切换深色预览</button></div>
<div class="section-title">完整状态集<span>点选状态，定位下方文件行</span></div><div class="mockup catalog" id="catalog" data-palette="light"></div>
<div class="section-title">放进文件列表<span id="form-note">文字贴纸 · 原尺寸预览</span></div><div class="mockup file-card" id="file-card" data-palette="light"><div class="summary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="summary-icon"><path d="m6 9 6 6 6-6"/></svg><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="summary-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg><strong>7 个文件已更改</strong><span class="stats"><span class="plus">+210</span><span class="minus">-50</span></span></div><div class="rows" id="rows"></div></div>
<div class="footnote"><strong id="active-title">NEW · 新增</strong><span id="active-description">绿色配合星芒图形，标记本轮新增文件。</span></div>
<div class="secondary"><div class="section-title">两种形态，同一套语言<span>文字说明状态，图形节省空间</span></div><div class="mockup pair-grid" id="pairs" data-palette="light"></div></div>
<div class="bottom"><div class="footer-note"><b>水平排列 · 20px 底板 · 低饱和配色</b><span>原创 SVG / 浅色 + 深色</span></div><p class="note">推荐默认使用文字贴纸；紧凑列表可用图形贴纸，悬停显示完整中文状态。MODE 对应权限变化，TEXT 覆盖换行与编码变化。</p></div>
<script>
const badges=[{"id":"added","label":"新增","word":"NEW","file":"debug-flowchart.html","ext":"html","added":186,"removed":0,"light":["#EAF6EE","#BFDFC9","#2F7747"],"dark":["#243A2C","#40614C","#A8DDB9"],"glyph":"<path d=\"M8 4v8M4 8h8\"/><path d=\"M13 2v3M11.5 3.5h3\" stroke-width=\"1.2\"/>"},{"id":"modified","label":"修改","word":"EDIT","file":"TurnChangesBar.tsx","ext":"tsx","added":24,"removed":12,"light":["#EBF2FF","#CBDCF3","#3867A6"],"dark":["#253044","#3F5574","#AACDFA"],"glyph":"<path d=\"m9.8 2.5 3.7 3.7-6.6 6.6-4.5.8.8-4.5Z\"/><path d=\"m8 4.3 3.7 3.7\"/>"},{"id":"deleted","label":"删除","word":"DEL","file":"legacy-adapter.ts","ext":"ts","added":0,"removed":38,"light":["#FFF0ED","#F1D0C9","#AF5147"],"dark":["#3F2A2D","#6A4247","#F5B6AF"],"glyph":"<path d=\"M4 8h8\"/>"},{"id":"renamed","label":"重命名","word":"REN","file":"utils.ts → change-utils.ts","ext":"ts","added":0,"removed":0,"light":["#F0EBFF","#D8CCF5","#7050AB"],"dark":["#302A43","#514367","#D3BEFC"],"glyph":"<path d=\"M2.5 5.5h5a3 3 0 0 1 3 3v3\"/><path d=\"m7.5 8.5 3 3 3-3\"/>"},{"id":"type-changed","label":"类型变化","word":"TYPE","file":"assets/shortcut","ext":"link","added":null,"removed":null,"light":["#FFF5E4","#EAD9B9","#8D6829"],"dark":["#3A3326","#62563B","#E9CD94"],"glyph":"<rect x=\"2.5\" y=\"2.5\" width=\"6\" height=\"6\" rx=\"1.5\"/><circle cx=\"10.5\" cy=\"10.5\" r=\"3\"/>"},{"id":"mode-changed","label":"权限变化","word":"MODE","file":"scripts/build.sh","ext":"sh","added":0,"removed":0,"light":["#EEF1F6","#D2D9E5","#63708B"],"dark":["#2C313B","#4A5363","#C1CBDD"],"glyph":"<rect x=\"3.4\" y=\"7\" width=\"9.2\" height=\"7\" rx=\"1.8\"/><path d=\"M5.2 7V4.8a2.8 2.8 0 0 1 5.6 0V7M8 10v1\"/>"},{"id":"eol-or-encoding","label":"换行 / 编码","word":"TEXT","file":"config/defaults.json","ext":"json","added":0,"removed":0,"light":["#F4EEF6","#E0D0E5","#83608F"],"dark":["#352D3D","#594765","#D9BCE6"],"glyph":"<path d=\"m5 4.5-3 3.5 3 3.5m6-7 3 3.5-3 3.5M9 3l-2 10\"/>"}];
const makeSvg=function svg(badge, variant = 'label', theme = 'light') {
  const [fill, edge, ink] = badge[theme]
  const title = escape(badge.label)
  const body = variant === 'label'
    ? `<g><rect x="2.5" y="4" width="43" height="20" rx="5" fill="${fill}" stroke="${edge}"/><text x="24" y="17.6" fill="${ink}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="800" font-style="italic" letter-spacing=".25">${badge.word}</text></g>`
    : `<g><rect x="3" y="3.5" width="22" height="21" rx="6" fill="${fill}" stroke="${edge}"/><g transform="translate(6 6)" fill="none" stroke="${ink}" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${badge.glyph}</g></g>`
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${variant === 'label' ? 48 : 28}" height="28" viewBox="0 0 ${variant === 'label' ? 48 : 28} 28" role="img" aria-label="${title}"><title>${title}</title>${body}</svg>`
};
const escape=value => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('"', '&quot;');
const descriptions={added:'绿色配合星芒图形，标记本轮新增文件。',modified:'蓝色与铅笔图形表示修改，字形与底板沿用同一套规格。',deleted:'柔和珊瑚色搭配减号，在密集列表里保持清晰。',renamed:'紫色与转向箭头表示名称或路径变化。', 'type-changed':'暖砂色搭配方形与圆形，表示文件类型发生变化。', 'mode-changed':'灰蓝色与锁形图标，表示文件权限变化。', 'eol-or-encoding':'灰紫色与代码符号，表示换行或编码变化。'};
let state={variant:'label',palette:'light',active:'added'};
const external='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M15 3h6v6m0-6-11 11M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg>';
function iconFor(ext){if(ext==='html')return '<svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#E75A24" d="m3 2 1.6 18L12 22l7.4-2L21 2Z"/><path fill="#fff" d="M7 6h10l-.2 2H9.2l.2 2h7.2l-.6 7-4 1.1L8 17l-.3-3h2l.1 1.5 2.2.6 2.2-.6.2-3.5h-7Z"/></svg>';if(ext==='tsx')return '<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="#519ABB" stroke-width="1.3" aria-hidden="true"><ellipse cx="12" cy="12" rx="11" ry="4.2"/><ellipse cx="12" cy="12" rx="11" ry="4.2" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="11" ry="4.2" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="2" fill="#519ABB" stroke="none"/></svg>';if(ext==='ts')return '<svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="3" fill="#498AC5"/><text x="5" y="17" fill="#fff" font-family="Arial" font-size="10" font-weight="700">TS</text></svg>';return '<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="'+(ext==='json'?'#B1934D':ext==='sh'?'#739985':'#8C8B99')+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13l2 2-2 2m5 0h3"/></svg>'}
function badgeMarkup(badge,variant){return makeSvg(badge,variant,state.palette).replace('<svg ','<svg class="badge badge-'+variant+'" ')}
function render(){
 document.querySelectorAll('.mockup').forEach(el=>el.dataset.palette=state.palette);
 document.getElementById('catalog').innerHTML=badges.map(b=>'<button class="catalog-item" data-status="'+b.id+'" aria-pressed="'+(b.id===state.active)+'" title="'+b.label+'">'+badgeMarkup(b,state.variant)+'<small>'+b.label+'</small></button>').join('');
 document.getElementById('rows').innerHTML=badges.map(b=>'<div class="file-row '+(b.id===state.active?'is-active':'')+'" data-row="'+b.id+'">'+iconFor(b.ext)+'<span class="file-name" title="'+escape(b.file)+'"><span class="path-prefix">'+(b.id==='added'?'diagrams/':b.id==='type-changed'||b.id==='mode-changed'||b.id==='eol-or-encoding'?'':'src/')+'</span>'+escape(b.file)+'</span><span class="badge-slot">'+badgeMarkup(b,state.variant)+'</span><span class="stats">'+(b.added===null?'<span class="muted-stat">—</span>':'<span class="plus">+'+b.added+'</span><span class="minus">−'+b.removed+'</span>')+'</span><span class="external">'+external+'</span></div>').join('');
 document.getElementById('pairs').innerHTML=badges.map(b=>'<div class="pair" title="'+b.label+'">'+badgeMarkup(b,'label')+badgeMarkup(b,'icon')+'</div>').join('');
 document.querySelectorAll('[data-variant]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.variant===state.variant)));
 document.getElementById('palette-button').textContent=state.palette==='light'?'切换深色预览':'切换浅色预览';
 document.getElementById('form-note').textContent=(state.variant==='label'?'文字贴纸':'图形贴纸')+' · 原尺寸预览';
 const active=badges.find(b=>b.id===state.active);document.getElementById('active-title').textContent=active.word+' · '+active.label;document.getElementById('active-description').textContent=descriptions[active.id];
}
document.querySelectorAll('[data-variant]').forEach(button=>button.addEventListener('click',()=>{state.variant=button.dataset.variant;render()}));
document.getElementById('palette-button').addEventListener('click',()=>{state.palette=state.palette==='light'?'dark':'light';render()});
document.getElementById('catalog').addEventListener('click',event=>{const button=event.target.closest('[data-status]');if(button){state.active=button.dataset.status;render()}});
render();
</script></body></html>
