# Windows 应用、真实 Electron 产品冒烟和独立架构地图。
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/架构地图/package-lock.json
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # 根 lint 包含文档源码，类型检查所需依赖也必须先安装。
      - run: npm --prefix docs/架构地图 ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Electron 产品冒烟
        run: node scripts/check-workspace-close-electron.mjs --smoke
      - name: 上传 Electron 冒烟报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-electron-smoke
          path: tmp/product-electron-smoke/
          if-no-files-found: ignore
      - run: npm --prefix docs/架构地图 test
      - run: npm --prefix docs/架构地图 run build
